<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A3524">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="בדיקת התראות">
<title>בדיקת התראות</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: Assistant, Arial, sans-serif; margin: 0; background: #fff; color: #2B2118; }
  header { background: #4A3524; color: #fff; padding: 16px; font-size: 18px; font-weight: 600; }
  main { padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 480px; }
  button { font: inherit; font-size: 18px; background: #6A9A3A; color: #fff; border: 0; border-radius: 12px; padding: 14px; }
  .hint { color: #8A7A68; font-size: 15px; line-height: 1.5; }
  #msg { font-size: 16px; min-height: 24px; }
</style>
</head>
<body>
<header>בדיקת התראות – מלאי</header>
<main>
  <div class="hint">דף ניסיון בלבד, בלי כניסה ובלי נתונים. לוחצים על הכפתור, מאשרים התראות, ואמורה להופיע התראה לדוגמה.</div>
  <button id="go">שלח התראת בדיקה</button>
  <div id="msg"></div>
  <div class="hint" id="ios"></div>
</main>
<script>
  const msg = t => { document.getElementById('msg').textContent = t; };
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (/iPhone|iPad/.test(navigator.userAgent) && !standalone) {
    document.getElementById('ios').textContent = 'באייפון: קודם לוחצים על כפתור השיתוף ובוחרים "הוסף למסך הבית", ואז פותחים את הדף מהאייקון "בדיקת התראות" שנוצר.';
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  async function send(delay) {
    if (!('Notification' in window) || !('serviceWorker' in navigator)) {
      return msg('המכשיר הזה לא תומך בהתראות מהדפדפן' + (/iPhone|iPad/.test(navigator.userAgent) ? ' – באייפון רק אחרי "הוסף למסך הבית".' : '.'));
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return msg('ההתראות לא אושרו. אפשר לאשר בהגדרות הטלפון.');
    const reg = await navigator.serviceWorker.ready;
    if (delay) msg('ההתראה תגיע בעוד 10 שניות…');
    setTimeout(async () => {
      await reg.showNotification('מלאי · משיכה מעבר למלאי', {
        body: 'יוסי משך 30 מטר צינור סגול 20 מ"מ ממכולה 1, אבל לפי המערכת לא היה שם מספיק.',
        icon: '../icons/icon-192.png', badge: '../icons/icon-192.png', dir: 'rtl', lang: 'he', tag: 'test',
        data: { url: location.href },
      });
      msg('נשלחה התראת בדיקה');
    }, delay || 0);
  }
  document.getElementById('go').onclick = () => send(0);
</script>
</body>
</html>
